name: CI (PR 빌드 검사)

# main / integrate 로 가는 PR에서 "머지 전에" 빌드를 돌려
# 컴파일(tsc) 에러가 main에 들어가 자동배포를 깨뜨리는 걸 막는다.
# (배포 파이프라인 docker-build.yml / deploy.yml 과는 독립적으로 동작)
on:
  pull_request:
    branches: [main, integrate]

# 같은 PR에 연속 push 시 이전 실행은 취소(러너 절약)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 프론트 빌드 = 배포 Dockerfile의 builder 단계(node:20 + npm ci + npm run build)와 동일.
  # 오늘 main을 깨뜨린 TS2305 같은 tsc 에러가 여기서 잡힌다.
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 한 앱 실패가 다른 앱 검사를 가리지 않도록
      matrix:
        # company-web 도 배포 대상(docker-compose.prod.yml)이므로 함께 게이트한다 —
        # 빠지면 company-web 의 tsc 에러가 CI 를 통과해 그대로 prod 로 샌다.
        app: [guardian-web, vet-web, company-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install (npm ci)
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  # 백엔드는 Docker 빌드가 파이썬을 실행하지 않아 문법 에러를 못 잡으므로,
  # 무거운 AI 의존성 설치 없이 바이트컴파일만으로 빠르게 문법 검사.
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check (syntax)
        # ai/ 도 포함 — Docker 빌드가 파이썬을 실행하지 않아 ai/ 문법오류가 그냥 prod 로 샌다.
        run: python -m compileall -q backend/app ai

  # 단위/회귀 테스트 게이트 — "테스트가 존재한다"가 아니라 "PR 머지 전에 실제로 돌아 회귀를 막는다".
  # 외부 의존(실제 OpenAI/DB)이 필요한 테스트는 제외한다:
  #   - `-m "not live"` : 실제 OpenAI 호출 테스트(test_triage_live) 비선택
  #   - tests/conftest.py(collect_ignore) : 옛 API 참조하는 stale 테스트 수집 제외
  # 게이트되는 테스트는 LLM 을 monkeypatch 로 stub 하고 DB 도 stub 하므로 외부 연동/DB 가 필요 없다.
  # CNN 비전(torch)은 lazy import 라 에이전트 import 시 안 딸려와 vision 의존성도 불필요.
  backend-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ai/requirements-ai.txt

      - name: Install deps (backend + 경량 AI, vision/torch 제외)
        run: pip install -r backend/requirements.txt -r ai/requirements-ai.txt "pytest>=8,<9"

      - name: Run pytest (live/외부의존 제외)
        working-directory: backend
        env:
          # 테스트는 JWT 서명을 하지 않으므로 기본 SECRET_KEY 경고만 억제(동작 영향 없음).
          DEBUG: "true"
        run: python -m pytest -m "not live" -q

  # 마이그레이션 안전성 검사 — 무거운 AI 의존성 없이 alembic 핵심만 가볍게.
  # ① 멀티 헤드(머지 실수) 차단  ② 빈 DB에 upgrade head 가 깨지지 않는지  ③ 모델↔DB 드리프트(비차단)
  backend-migrations:
    runs-on: ubuntu-latest
    services:
      db:
        # 마이그레이션이 vector/btree_gist 확장을 쓰므로 prod 와 동일한 pgvector 이미지를 쓴다.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: medipaw
          POSTGRES_USER: medipaw
          POSTGRES_PASSWORD: medipaw_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medipaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://medipaw:medipaw_secret@localhost:5432/medipaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install alembic deps (no heavy AI libs)
        # env.py 가 모델을 임포트하므로 pgvector(triage_rag_document) 까지만 추가로 설치.
        run: pip install alembic SQLAlchemy psycopg2-binary "pydantic>=2" pydantic-settings pgvector

      - name: Single head check (멀티 헤드 = 머지 실수)
        working-directory: backend
        run: |
          alembic heads
          test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: Upgrade head on fresh DB
        working-directory: backend
        run: alembic upgrade head

      - name: Model↔migration drift (informational, 비차단)
        working-directory: backend
        run: alembic check || echo "::warning::alembic check 가 드리프트를 보고함 — 검토 권장(빌드는 통과)"
