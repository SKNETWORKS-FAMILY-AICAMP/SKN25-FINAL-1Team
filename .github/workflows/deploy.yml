name: Deploy to EC2

# main 의 "Docker Build & Push" 가 성공적으로 끝나면 자동 실행.
# (이미지가 Docker Hub에 올라간 뒤 EC2가 pull 하도록 순서 보장)
# 수동 실행도 가능 (Actions 탭 → Run workflow).
on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 수동 실행이거나, build가 main에서 성공했을 때만 배포
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/medipaw"

      # ── 1차 시도 ─────────────────────────────────────────────────────
      - name: EC2에 SSH 접속해서 최신 이미지로 갱신
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/medipaw
            # 최신 이미지 받기 (backend + guardian + vet 전체)
            sudo docker compose -f docker-compose.prod.yml pull
            # 마이그레이션 + 전체 재시작
            sudo docker compose -f docker-compose.prod.yml up -d
            # backend가 재생성되면 도커 네트워크 IP가 바뀌는데, 이미지 변화가 없는
            # 프론트(guardian/vet)는 그대로 유지돼 nginx가 옛 backend IP를 캐시→502.
            # 프론트를 강제 restart 해서 nginx가 backend를 다시 resolve 하도록 보장.
            sudo docker compose -f docker-compose.prod.yml restart guardian vet
            # 안 쓰는 옛 이미지 정리(디스크 절약)
            sudo docker image prune -f
            echo "=== 배포 후 상태 ==="
            sudo docker compose -f docker-compose.prod.yml ps

      # ── SSH 타임아웃 등 일시적 실패 시 1회 자동 재시도 ──────────────────
      - name: 배포 재시도 (1차 실패 시)
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/medipaw
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d
            # 프론트 강제 restart (nginx가 옛 backend IP 캐시→502 방지)
            sudo docker compose -f docker-compose.prod.yml restart guardian vet
            sudo docker image prune -f
            echo "=== 배포 후 상태 (재시도) ==="
            sudo docker compose -f docker-compose.prod.yml ps
