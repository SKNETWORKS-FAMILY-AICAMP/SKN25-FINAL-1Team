# MediPaw 전체 스택
# 사용법(가장 쉬움):  ./dev.sh   (레포 루트에서. 마이그레이션/시딩까지 알아서 처리)
# 수동:
#   1. cp backend/.env.example backend/.env  (그리고 OPENAI_API_KEY 채우기)
#   2. docker compose -f ai/docker/docker-compose.yml up --build
#      → db/backend/guardian/vet/company 기동(일상 개발용).
#   3. (최초 1회) 마이그레이션+시딩:
#      docker compose -f ai/docker/docker-compose.yml --profile setup run --rm migrate
#      migrate/seed/seed-rag 는 profiles:["setup"] 라서 평소 up 에는 안 뜸.
#
# 참고: backend 이미지는 기본적으로 비전(torch) 미설치(INSTALL_VISION=false)로 가볍게 뜸.
#       사진 분석을 테스트하려면 backend.build.args.INSTALL_VISION 을 "true" 로 바꿔 재빌드.

services:
  # ── PostgreSQL ───────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medipaw
      POSTGRES_USER: medipaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medipaw_secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medipaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medipaw_net

  # ── FastAPI Backend (AI 포함) ─────────────────────────────────────
  backend:
    build:
      context: ../..
      dockerfile: ai/docker/Dockerfile.backend
      args:
        # dev 에서는 비전(torch) 미설치로 이미지/빌드/기동 대폭 단축(~6GB 절감).
        # 사진 분석을 로컬에서 테스트하려면 "true" 로 바꾼 뒤 ./dev.sh 로 재빌드.
        INSTALL_VISION: "true"
    env_file:
      - ../../backend/.env
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://medipaw:${POSTGRES_PASSWORD:-medipaw_secret}@db:5432/medipaw
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      DEBUG: false
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/backend/uploads
      - ../../backend/models:/app/backend/models:ro
      - ../../backend/data:/app/backend/data:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - medipaw_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── DB 마이그레이션 ──────────────────────────────────────────────
  # 매 `up` 마다 alembic upgrade head 실행(멱등) → 새 마이그레이션이 항상 반영됨.
  # (seed/seed-rag 와 달리 profile 로 빼지 않음: 개발 중 스키마 누락 방지)
  migrate:
    build:
      context: ../..
      dockerfile: ai/docker/Dockerfile.backend
    command: >
      bash -c "cd /app/backend && alembic upgrade head"
    environment:
      DATABASE_URL: postgresql://medipaw:${POSTGRES_PASSWORD:-medipaw_secret}@db:5432/medipaw
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-medipaw-bucket}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medipaw_net
    restart: "no"

  # ── Drug DB 시딩 (1회성) ────────────────────────────────────────
  # dev.sh 는 backend 컨테이너 내부 exec 로 시딩하므로 이 서비스는 자동 기동 불필요.
  seed:
    profiles: ["setup"]
    build:
      context: ../..
      dockerfile: ai/docker/Dockerfile.backend
    command: >
      bash -c "cd /app/backend && python scripts/seed_drugs.py"
    environment:
      DATABASE_URL: postgresql://medipaw:${POSTGRES_PASSWORD:-medipaw_secret}@db:5432/medipaw
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - medipaw_net
    restart: "no"

  # ── Triage RAG 적재 (1회성) ─────────────────────────────────────
  # 덤프(data/triage/triage_rag_export.jsonl.gz)가 있으면 비어있을 때만 적재, 이미 있으면 스킵.
  # 덤프가 없으면 에러 없이 스킵(원본 임베딩은 build_triage_pgvector_index.py로 별도 생성).
  seed-rag:
    profiles: ["setup"]
    build:
      context: ../..
      dockerfile: ai/docker/Dockerfile.backend
    command: >
      bash -c "cd /app/backend && python scripts/load_triage_rag.py"
    environment:
      DATABASE_URL: postgresql://medipaw:${POSTGRES_PASSWORD:-medipaw_secret}@db:5432/medipaw
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - medipaw_net
    restart: "no"

  # ── Guardian Frontend (보호자 앱) ─────────────────────────────────
  guardian:
    build:
      context: ../..
      dockerfile: ai/docker/Dockerfile.guardian
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - medipaw_net

  # ── Vet Frontend (수의사 대시보드) ────────────────────────────────
  vet:
    build:
      context: ../..
      dockerfile: ai/docker/Dockerfile.vet
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - medipaw_net

  # ── Company Frontend (회사 소개 사이트) ───────────────────────────
  # 정적 사이트라 backend 불필요. dev 는 컨테이너 안에서 빌드(Dockerfile.company.dev).
  company:
    build:
      context: ../..
      dockerfile: ai/docker/Dockerfile.company.dev
    restart: unless-stopped
    ports:
      - "5175:5175"
    networks:
      - medipaw_net

volumes:
  postgres_data:
  uploads_data:

networks:
  medipaw_net:
    driver: bridge
