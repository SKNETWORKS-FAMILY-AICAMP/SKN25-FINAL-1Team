server {
    listen 5175;
    root /usr/share/nginx/html;
    index index.html;

    # backend 컨테이너 재생성으로 IP가 바뀌어도 따라가도록 Docker 내장 DNS로 재해석.
    # (proxy_pass에 변수를 써야 요청 시점마다 resolver로 다시 해석한다.)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 정적 소개 사이트 — SPA fallback (/apply, /admin 직접 진입 지원)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 → backend (입점 신청 / 운영진 콘솔). /api prefix 제거 후 전달.
    location /api/ {
        # 영상 첨부 업로드 허용 (nginx 기본 1MB → 50MB)
        client_max_body_size 50m;
        set $backend backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }
}
