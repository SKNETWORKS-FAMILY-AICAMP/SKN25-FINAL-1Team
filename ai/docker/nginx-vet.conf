server {
    listen 5174;
    root /usr/share/nginx/html;
    index index.html;

    # backend 컨테이너 재생성으로 IP가 바뀌어도 따라가도록 Docker 내장 DNS로 재해석.
    # (proxy_pass에 변수를 써야 요청 시점마다 resolver로 다시 해석한다.)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # ── 봇/스크래퍼 차단 (HTML 서빙에만 적용; /api·/uploads는 제외) ──
        # 수의사 대시보드는 내부 업무용 앱이라 검색 색인이 불필요하다.
        # 크롤러·자동화 도구·UA 없는 요청을 403 처리한다.
        # (API는 토큰 인증으로 보호되고, 테스트 스크립트가 막히면 안 되므로 제외)
        if ($http_user_agent ~* "(bot|crawl|spider|slurp|scrapy|curl|wget|python-requests|httpx|aiohttp|java/|go-http|libwww|okhttp|nikto|sqlmap|nmap|masscan|semrush|ahrefs|mj12|dotbot|petalbot|bytespider|gptbot|ccbot|claude|anthropic|amazonbot|facebookexternalhit|headlesschrome|phantomjs)") {
            return 403;
        }
        if ($http_user_agent = "") {
            return 403;
        }
        # 색인 차단을 HTTP 헤더로도 한 번 더 (HTML 외 자산까지 커버)
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # /api prefix 제거 후 backend로 전달
    location /api/ {
        # 영상 첨부 업로드 허용 (nginx 기본 1MB → 50MB)
        client_max_body_size 50m;
        set $backend backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
    }

    # 업로드 파일 서빙 (prefix 유지)
    location /uploads/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
    }
}
