server {
    listen 5174;
    root /usr/share/nginx/html;
    index index.html;

    # backend 컨테이너 재생성으로 IP가 바뀌어도 따라가도록 Docker 내장 DNS로 재해석.
    # (proxy_pass에 변수를 써야 요청 시점마다 resolver로 다시 해석한다.)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api prefix 제거 후 backend로 전달
    location /api/ {
        set $backend backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
    }

    # 업로드 파일 서빙 (prefix 유지)
    location /uploads/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
    }
}
