# Windows PC / 운영 환경용 — 이미지를 Docker Hub에서 pull해서 실행
# 사용법:
#   1. .env 파일 준비 (아래 항목 채우기)
#   2. docker compose -f docker-compose.prod.yml pull
#   3. docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medipaw
      POSTGRES_USER: medipaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medipaw_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medipaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medipaw_net

  backend:
    image: chany0812/medipaw-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://medipaw:${POSTGRES_PASSWORD:-medipaw_secret}@db:5432/medipaw
      # fail-fast: EC2 ~/medipaw/.env 에 SECRET_KEY 가 없으면 컨테이너가 아예 안 뜸.
      # (빈 키로 JWT 서명되어 토큰 위조가 가능해지는 사고 방지)
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in ~/medipaw/.env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-medipaw-images}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      DEBUG: false
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - medipaw_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    image: chany0812/medipaw-backend:latest
    # alembic 은 스키마만 만든다 → 앱이 실제로 필요로 하는 참조데이터(약품 마스터)는
    # 멱등 시드로 매 배포 채운다. 비어 있으면 처방전 자동생성이 후보 약품 0개라
    # 조용히 빈 결과를 내기 때문(에러 아님). seed_drugs.py 는 이미 있으면 스킵.
    command: bash -c "cd /app/backend && alembic upgrade head && python scripts/seed_drugs.py"
    environment:
      DATABASE_URL: postgresql://medipaw:${POSTGRES_PASSWORD:-medipaw_secret}@db:5432/medipaw
      # migrate 는 alembic 만 돌리고 JWT 서명을 하지 않아 SECRET_KEY 값 자체는 안 쓰이지만,
      # backend 와 같은 .env 를 공유하므로 기준을 통일한다(약한 기본값 'change-me' 제거).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in ~/medipaw/.env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-medipaw-images}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medipaw_net
    restart: "no"

  # ── Triage RAG 적재 ─────────────────────────────────────────────
  # 문진 의심질환 추천이 근거로 삼는 과거 수의사 진료사례(임베딩 포함)를 prod DB에 적재.
  # 덤프는 632MB라 .gitignore + Docker 이미지에 못 들어가므로(dev 는 레포 볼륨 마운트로 읽음),
  # 운영은 EC2 호스트 ~/medipaw/seed/ 에 덤프를 두고 ./seed 로 마운트해 읽는다.
  # deploy.yml 의 scp 는 compose/Caddyfile 만 덮으므로 ~/medipaw/seed 덤프는 배포 간 유지된다.
  # 멱등: 이미 있으면 스킵, 덤프 파일이 없으면 에러 없이 스킵(배포는 안 깨짐). OpenAI 호출 없음.
  seed-rag:
    image: chany0812/medipaw-backend:latest
    command: bash -c "cd /app/backend && python scripts/load_triage_rag.py --in /seed/triage_rag_export.jsonl.gz"
    environment:
      DATABASE_URL: postgresql://medipaw:${POSTGRES_PASSWORD:-medipaw_secret}@db:5432/medipaw
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in ~/medipaw/.env}
      # 신규 EC2 등 ./seed 마운트에 덤프가 없을 때 S3 에서 자동 다운로드(임베딩 포함 → OpenAI 불필요).
      # 마운트 파일이 있으면 그걸 우선 쓰고 S3 는 안 탄다(평소 배포는 egress 0). 자격증명은 backend 와 동일.
      SEED_RAG_S3_BUCKET: ${SEED_RAG_S3_BUCKET:-medipaw-images}
      SEED_RAG_S3_KEY: ${SEED_RAG_S3_KEY:-seed/triage_rag_export.jsonl.gz}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - medipaw_net
    restart: "no"

  guardian:
    image: chany0812/medipaw-guardian:latest
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - medipaw_net

  vet:
    image: chany0812/medipaw-vet:latest
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - medipaw_net

  company:
    image: chany0812/medipaw-company:latest
    restart: unless-stopped
    ports:
      - "5175:5175"
    networks:
      - medipaw_net

  # HTTPS 종단(리버스 프록시). Let's Encrypt 인증서 자동 발급/갱신.
  # medipaw.app 서브도메인을 받아 내부 프론트/백엔드로 분배한다.
  # 음성인식(getUserMedia/Web Speech)이 secure context를 요구하므로 필수.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급된 인증서 영속화(재시작 시 재발급 방지 → ACME rate limit 회피)
      - caddy_config:/config
    depends_on:
      - guardian
      - vet
      - company
      - backend
    networks:
      - medipaw_net

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  medipaw_net:
    driver: bridge
